name: PropertyX CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: propertyx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Report dependency security advisories
        run: |
          npm audit --json > /tmp/propertyx-audit.json || true
          node -e "const a=require('/tmp/propertyx-audit.json'); const rows=Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via})); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities,packages:rows},null,2));"
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build
